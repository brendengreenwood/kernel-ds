name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  catalog:
    name: catalog (types + integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Tests
        run: npm run catalog:test
      - name: Typecheck
        run: npm run catalog:check
      - name: Catalog integrity
        run: node kernel-portal/scripts/check-catalog.mjs

  portal:
    name: portal (build + gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel-portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kernel-portal/package-lock.json
      - run: npm ci

      # Typecheck + build (tsc -b && vite build)
      - name: Build
        run: npm run build

      # Lint — 0 errors required (oxlint)
      - name: Lint
        run: npm run lint

      # Verification gates (canonical order — see kernel-portal/AGENTS.md)
      - name: Doc-entity source parity
        run: node scripts/check-component-docs.mjs
      - name: Doc coverage
        run: node scripts/check-component-docs.mjs --coverage
      - name: Prose quality
        run: node scripts/check-prose-quality.mjs
      - name: Style fidelity
        run: node scripts/check-style-fidelity.mjs
      - name: Status→tone map integrity
        run: node scripts/check-status-map.mjs
      - name: Composition contract
        run: node scripts/emit-composition.mjs

      # Runtime __check__ assertions (.mts run via --experimental-strip-types, Node 24)
      - name: Doc schema assertions
        run: node --experimental-strip-types src/lib/component-docs/__check__.mts
      - name: Object-model assertions
        run: node --experimental-strip-types src/lib/objects/__check__.mts
      - name: Marks assertions
        run: node src/components/ui/marks/__check__.mjs

  studio:
    name: studio (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            kernel-portal/package-lock.json
            kernel-studio-server/package-lock.json

      # The studio agent reads the generated ds-bundle at runtime, and the
      # ds-bundle tool tests read it too. It's gitignored, so build it from the
      # portal (which owns the build script + its vite dependency) before tests.
      - name: Install portal deps (for bundle build)
        working-directory: kernel-portal
        run: npm ci
      - name: Build ds-bundle
        working-directory: kernel-portal
        run: node scripts/build-ds-bundle.mjs

      - name: Install studio deps
        working-directory: kernel-studio-server
        run: npm ci
      - name: Typecheck
        working-directory: kernel-studio-server
        run: npm run check
      - name: Tests
        working-directory: kernel-studio-server
        run: npm test

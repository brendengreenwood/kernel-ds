name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kernel-portal/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - run: npm run lint

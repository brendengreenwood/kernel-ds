[build]
  base = "kernel-portal"
  command = "npm run build"
  publish = "dist"

# The Kernel v2 prototype lives in kernel-app/. On this branch (and its
# deploy previews) build the prototype instead of the design-system portal —
# so the preview shows the prototype, not the portal. Scoped to the branch, so
# main and every other preview keep building kernel-portal unchanged.
# NOTE: the branch name below is historical ("insider") — it predates the
# reframe to "v2 prototype" and must stay verbatim or the preview silently
# falls back to building the portal.
[context."claude/kernel-insider-portal-fvqfq2"]
  # Build from the repo ROOT so both packages are unambiguously present:
  # kernel-app consumes the DS at source, so its components resolve
  # @base-ui/react etc. from kernel-portal/node_modules. Install both, build
  # the app, publish the app's dist.
  base = "/"
  command = "npm --prefix kernel-portal install --no-audit --no-fund && npm --prefix kernel-app install --no-audit --no-fund && npm --prefix kernel-app run build"
  publish = "kernel-app/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  base = "kernel-portal"
  # The portal consumes @kernel/ui and @kernel/definitions via file: deps, so the
  # workspace packages must be built before the portal build (same order as CI).
  command = "cd .. && npm ci && npm run ui:build && npm run definitions:build && cd kernel-portal && npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The Kernel v2 prototype lives in kernel-app/. On this branch (and its
# deploy previews) build the prototype instead of the design-system portal —
# so the preview shows the prototype, not the portal. Scoped to the branch, so
# main and every other preview keep building kernel-portal unchanged.
# NOTE: the branch name below is historical ("insider") — it predates the
# reframe to "v2 prototype" and must stay verbatim or the preview silently
# falls back to building the portal.
[context."claude/kernel-insider-portal-fvqfq2"]
  # Build from the repo ROOT. kernel-app consumes the DS at source from
  # packages/ui, whose own deps (@base-ui/react, @mdi/js, …) are workspace
  # dependencies — so the root install is what makes them resolvable. The app
  # itself is deliberately NOT a workspace (decision 0036 fences it as
  # unmanaged), hence its separate install.
  base = "/"
  command = "npm ci --no-audit --no-fund && npm --prefix kernel-app install --no-audit --no-fund && npm --prefix kernel-app run build"
  publish = "kernel-app/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
